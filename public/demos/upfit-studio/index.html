<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; connect-src 'self'; img-src 'self' data:; font-src 'self' data:">
<title>Upfit Studio</title>
<link rel="stylesheet" href="app.css">
<meta name="robots" content="noindex">
<script src="demo-backend.js"></script>
<script defer src="/demos/_shared/demo-banner.js" data-back="/projects/upfit-studio/" data-note="The real Upfit Studio interface in your browser, answered from a recorded copy of the F-150 plan (prices and part notes removed). The simulator covers every slide position, the brake and up to three buttons at once. Edits are turned off."></script>
<style>.demo-hide{display:none!important}</style>
</head>
<body>
<div class="boot" id="boot"><div class="inner"><div class="spinner"></div>Loading your upfit…</div></div>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f5a524" stroke-width="2.2" stroke-linecap="round"><path d="M4 14h16M7 14l2-6h6l2 6"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M12 3v2"/><path d="M8.5 4.2l.8 1.6M15.5 4.2l-.8 1.6"/></svg>
      </div>
      <div><div class="brand-name">Upfit Studio</div><div class="brand-sub">Interactive builder</div></div>
    </div>
    <div class="vehicle-chip" id="vehicleChip"></div>
    <div class="search-trigger" data-action="palette">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      Search circuits, parts, outputs, actions
      <span class="kbd">Ctrl K</span>
    </div>
    <button class="icon-btn" title="Reload upfit.yaml (F5)" data-action="reload">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/></svg>
    </button>
    <button class="icon-btn" title="Light or dark" data-action="theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <nav class="sidebar" id="nav"></nav>
  <main class="main" id="main"></main>
  <footer class="statusbar">
    <span><span class="dot"></span>Offline</span>
    <span>Read-only toward the truck</span>
    <span class="path" id="sbPath"></span>
    <span class="right"><span class="sync-chip" id="sbSync" data-go="sync">Sync</span><span id="sbLoaded"></span><span id="sbVersion"></span></span>
  </footer>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
<script src="head.js"></script>
<script src="controllers.js"></script>
</body>
</html>
